# SPDX-License-Identifier: GPL-3.0-or-later
# One-click release: bumps the version, commits, tags and pushes. The tag push
# starts the Release workflow. It has to be triggered that way: the push goes
# through the release deploy key (needed to get past the main ruleset), and a
# key push counts as a real push, unlike one made with GITHUB_TOKEN.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (patch, minor, major) or an explicit X.Y.Z
        required: true
        default: patch
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Pushing the version bump to main has to get past the "Protect main"
          # ruleset, which the default token may not do. A write deploy key
          # (RELEASE_SSH_KEY) is listed as a bypass actor instead; without it
          # the push fails and the job stops before tagging. See CONTRIBUTING.md.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test before tagging
        run: npm test

      - name: Bump version
        id: tag
        env:
          BUMP: ${{ inputs.bump }} # via env, never interpolated into the script
        run: |
          version="$(node scripts/version.mjs "$BUMP")"
          node scripts/check-version.mjs "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "X Blocker $TAG"
          # Main first: if this push is rejected, the tag is never published and
          # the workflow can be re-run. (The other order left an orphan tag.)
          if ! git push origin HEAD:main; then
            echo "::error::Could not push $TAG to main: the 'Protect main' ruleset rejected the key. Check that RELEASE_SSH_KEY matches a write deploy key listed under the ruleset's bypass actors. Nothing was tagged."
            exit 1
          fi
          # This push is what starts the Release workflow.
          git push origin "refs/tags/$TAG"
