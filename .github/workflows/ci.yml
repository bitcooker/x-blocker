# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Versions are consistent
        run: node scripts/check-version.mjs

      - run: npm test

      - name: Lint (web-ext, Firefox build)
        run: npm run lint

      - name: Build and package Firefox and Chrome
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: x-blocker-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
