# SPDX-License-Identifier: GPL-3.0-or-later
# Builds a tagged version, creates the GitHub Release (Firefox + Chrome packages)
# and submits the Firefox build to addons.mozilla.org. Runs on a pushed vX.Y.Z
# tag, or is called by "Prepare release". The AMO job is skipped (with a notice)
# when its secrets are not configured.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.7.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # full history and tags for the changelog

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag matches the extension version
        id: version
        run: echo "version=$(node scripts/check-version.mjs "$TAG")" >> "$GITHUB_OUTPUT"

      - run: npm test

      - name: Lint (web-ext, Firefox build)
        run: npm run lint

      - name: Build and package
        run: npm run package

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/changelog.mjs "$TAG" > dist/RELEASE_NOTES.md
          sed "s/{version}/$VERSION/g" .github/release-install.md >> dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/firefox/
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Create release with packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "X Blocker $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag

  firefox:
    name: Publish to Firefox Add-ons (AMO)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Skip when not configured
        if: env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == ''
        run: echo "::notice::AMO_JWT_ISSUER / AMO_JWT_SECRET not set; skipping Firefox Add-ons."

      - uses: actions/checkout@v7
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          name: release
          path: dist

      - uses: actions/setup-node@v7
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          node-version: 22

      # Full listing metadata for the first submission; afterwards only the
      # "version" part, so listing edits made on AMO are never overwritten.
      - name: Prepare AMO metadata
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: node scripts/amo-metadata.mjs dist/amo-metadata.json

      # Submits the version for review on the listed channel and returns
      # immediately; AMO publishes it once approved.
      - name: Submit to AMO
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          npx --yes web-ext@8 sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/amo \
            --channel listed \
            --amo-metadata dist/amo-metadata.json \
            --approval-timeout 0
